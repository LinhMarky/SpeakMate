spring.application.name=speakmate
app.ai.api-key=${GEMINI_API_KEY:}
app.ai.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
spring.config.import=optional:file:./application-local.properties

server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/speakmate?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# SQL owns the schema. Hibernate checks mapped columns without creating/changing tables.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Match Instant with the DATETIME(6) columns in speakmate.sql.
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# Reject unexpected fields such as role/is_active in registration JSON.
spring.jackson.deserialization.fail-on-unknown-properties=true
app.auth.jwt-secret=${JWT_SECRET:}
app.auth.google-client-id=${GOOGLE_CLIENT_ID:}
app.mail.from=${MAIL_FROM:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
